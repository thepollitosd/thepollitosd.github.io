function simField(k,label,min,max,step=1){return `<label class="field"><span>${label}</span><input type="number" min="${min}" max="${max}" step="${step}" value="${state.sim[k]}" onchange="changeSim('${k}',this.value,${min},${max})"></label>`}function changeSim(k,v,min,max){state.sim[k]=Math.min(max,Math.max(min,Number(v)||0));save();render()}function setOverride(id,k,v,min,max){state.overrides[id]={...(state.overrides[id]||{}),[k]:Math.min(max,Math.max(min,Number(v)||0))};save();render()}
function hist(r){let max=Math.max(...r.bins,1);return `<svg viewBox="0 0 390 172" role="img" aria-label="${L('Distribution of target attainment','Distribución del cumplimiento')}" style="width:100%;height:auto"><line x1="26" y1="135" x2="380" y2="135" stroke="var(--line)"/>${r.bins.map((n,i)=>`<rect x="${29+i*26.5}" y="${135-n/max*108}" width="21" height="${n/max*108}" rx="2" fill="${i>=6?'var(--accent)':'#afc2b7'}"><title>${i===12?'200%':Math.round(i/6*100)+'–'+Math.round((i+1)/6*100)+'%'}: ${pct(n/r.n)}</title></rect>`).join('')}<line x1="187" x2="187" y1="12" y2="135" stroke="var(--accent)" stroke-dasharray="4 4"/><g fill="var(--muted)" font-size="10"><text x="26" y="151">0%</text><text x="187" y="151" text-anchor="middle">100%</text><text x="380" y="151" text-anchor="end">200%</text><text x="200" y="168" text-anchor="middle">${L('Target attainment','Cumplimiento de meta')}</text></g></svg>`}
function simulation(){let p=get(simID),m=model(p),r=results()[p.id],o=state.overrides[p.id]||{};return hero('03 / Monte Carlo',L('Uncertainty, quantified.','Incertidumbre cuantificada.'),L('Run seeded simulations of September 2027 execution outcomes. Change assumptions to see the distribution shift.','Ejecuta simulaciones reproducibles de resultados a septiembre de 2027. Cambia supuestos y observa la distribución.'))+`<section class="panel"><div class="section-head"><h2>${L('Experiment settings','Configuración del experimento')}</h2><select onchange="simID=this.value;render()">${P.map(q=>opt(q,p.id)).join('')}</select></div><div class="inputgrid">${simField('weeks',L('Available weeks','Semanas disponibles'),1,44)}${simField('hours',L('Hours per week','Horas por semana'),1,30)}${simField('budget',L('Budget (USD)','Presupuesto (USD)'),0,10000)}${simField('availability',L('Usable time (%)','Tiempo utilizable (%)'),0,100)}${simField('partner',L('Partner access multiplier (%)','Multiplicador de acceso a socios (%)'),0,200)}${simField('reach',L('Adoption multiplier (%)','Multiplicador de adopción (%)'),0,300)}${simField('trials',L('Trials per project','Ensayos por proyecto'),100,50000,100)}${simField('seed',L('Random seed','Semilla aleatoria'),0,2147483647)}</div><div class="actions spaced"><button class="primary" onclick="simCache=null;render()">${L('Run simulation','Ejecutar simulación')}</button><button onclick="state.sim={...defaults.sim};save();render()">${L('Reset assumptions','Restablecer supuestos')}</button><button onclick="downloadCSV()">${L('Export results CSV','Exportar resultados CSV')}</button></div><p class="note">${L('Default inputs are hypothetical. Hours are personal project time, not total weekly obligations. Maintain a sustainable schedule.','Los valores iniciales son hipotéticos. Las horas son para proyectos personales, no obligaciones totales. Mantén un horario sostenible.')}</p></section><div class="grid stats spaced">${stat(L('MVP by deadline','MVP a tiempo'),pct(r.mvp),L('Time and budget sufficient','Tiempo y presupuesto suficientes'))}${stat(L('Target reached','Meta alcanzada'),pct(r.hit),fmt(m.target)+' '+m.unit)}${stat(L('Median outcome','Resultado mediano'),fmt(r.q50),m.unit)}${stat(L('P90 cost','Costo P90'),money(r.cost90),L('90th percentile of cost draw','Percentil 90 del costo'))}</div><div class="grid split">${panel('01 / '+L('Distribution','Distribución'),L('Target attainment','Cumplimiento de meta'),hist(r)+`<div class="grid detail-grid"><div class="metricbox"><strong>${fmt(r.q10)} / ${fmt(r.q50)} / ${fmt(r.q90)}</strong><span>P10 / P50 / P90 · ${m.unit}</span></div><div class="metricbox"><strong>${fmt(r.mean,1)}</strong><span>${L('Mean outcome','Resultado medio')}</span></div></div><p class="note">${L('Percentiles include unsuccessful trials; the distribution is capped at 200% of target. Hover bars for bin probabilities.','Los percentiles incluyen ensayos fallidos; distribución limitada a 200% de la meta. Pasa sobre barras para probabilidades.')}</p>`)}${panel('02 / '+L('Project parameters','Parámetros del proyecto'),p.name,`<div class="inputgrid two"><label class="field"><span>${L('Target units','Unidades objetivo')} (${m.unit})</span><input type="number" min="1" max="1000000" value="${m.target}" onchange="setOverride('${p.id}','target',this.value,1,1000000)"></label><label class="field"><span>${L('Effort multiplier (%)','Multiplicador de esfuerzo (%)')}</span><input type="number" min="10" max="400" value="${o.effort??100}" onchange="setOverride('${p.id}','effort',this.value,10,400)"></label><label class="field"><span>${L('Base partner probability (%)','Probabilidad base de socio (%)')}</span><input type="number" min="0" max="100" value="${o.partner??MODEL[idx(p)][4]*100}" onchange="setOverride('${p.id}','partner',this.value,0,100)"></label></div><p>${L('Build effort (low / mode / high)','Esfuerzo (bajo / moda / alto)')}: <strong>${m.effort.map(x=>fmt(x)).join(' / ')} h</strong></p><p>${L('Direct cost (low / mode / high)','Costo directo (bajo / moda / alto)')}: <strong>${m.cost.map(money).join(' / ')}</strong></p><p>${L('Adoption factor (low / mode / high)','Factor adopción (bajo / moda / alto)')}: <strong>${m.reach.join(' / ')}</strong></p><button onclick="delete state.overrides['${p.id}'];save();render()">${L('Reset project parameters','Restablecer parámetros')}</button>` )}</div><div class="spaced">${panel('03 / '+L('All projects','Todos los proyectos'),L('Probability of reaching target','Probabilidad de alcanzar meta'),`<div class="scroll"><table class="comparetable analysis-table"><thead><tr><th>${L('Project','Proyecto')}</th><th>MVP</th><th>${L('Target','Meta')}</th><th>P10 / P50 / P90</th><th>${L('Unit','Unidad')}</th></tr></thead><tbody>${[...P].sort((a,b)=>results()[b.id].hit-results()[a.id].hit).map(q=>{let v=results()[q.id];return `<tr><td><button onclick="simID='${q.id}';render()">${q.name}</button></td><td>${pct(v.mvp)}</td><td>${pct(v.hit)}${bar(v.hit*100)}</td><td>${[v.q10,v.q50,v.q90].map(x=>fmt(x)).join(' / ')}</td><td>${model(q).unit}</td></tr>`}).join('')}</tbody></table></div>`)}</div><div class="spaced">${methodology()}</div>`}
function methodology(){return panel('04 / '+L('Methodology','Metodología'),L('How the model works','Cómo funciona el modelo'),`<p>${L('Each trial draws independent triangular distributions for usable time, build effort, cost and adoption. Partner access is a Bernoulli event. An MVP succeeds when available hours and budget cover build requirements. If MVP and partner access succeed, outcome = floor(target × min(2, max(0, (available hours − effort) / (0.55 × effort)) × adoption)), otherwise zero.','Cada ensayo extrae distribuciones triangulares independientes para tiempo utilizable, esfuerzo, costo y adopción. El acceso a socios es un evento Bernoulli. El MVP se logra si horas y presupuesto cubren requisitos. Si MVP y acceso se logran: resultado = piso(meta × mín(2, máx(0, (horas disponibles − esfuerzo) / (0.55 × esfuerzo)) × adopción)); de lo contrario cero.')}</p><p class="note">${L('These are uncalibrated planning priors, not observed rates, causal estimates, or admission chances. Changing a target rescales the output rather than changing its modeled difficulty; adjust effort/adoption too if a target is more ambitious. Zero outcomes represent missing model prerequisites, not zero real-world value.','Son supuestos de planificación sin calibrar, no tasas observadas, estimaciones causales ni probabilidades de admisión. Cambiar la meta reescala el resultado sin cambiar su dificultad modelada; ajusta también esfuerzo/adopción si la meta es más ambiciosa. Cero significa requisitos no satisfechos, no ausencia de valor real.')}</p>`)}
function analytics(){let p=get(simID),base=simulate(p,state.sim,Math.min(state.sim.trials,5000)),factors=[['hours',L('Weekly hours','Horas semanales'),.7,1.3,30],['budget',L('Budget','Presupuesto'),.6,1.4,10000],['availability',L('Usable time','Tiempo utilizable'),.8,1.2,100],['partner',L('Partner access','Acceso a socios'),.7,1.3,200],['reach',L('Adoption','Adopción'),.7,1.3,300]],rows=factors.map(([k,label,lo,hi,max])=>({label,lo:simulate(p,{...state.sim,[k]:Math.min(max,state.sim[k]*lo)},base.n).hit,hi:simulate(p,{...state.sim,[k]:Math.min(max,state.sim[k]*hi)},base.n).hit,loPct:Math.round((lo-1)*100),hiPct:Math.round((hi-1)*100)})).sort((a,b)=>Math.abs(b.hi-b.lo)-Math.abs(a.hi-a.lo));let presets=[[L('Technical depth','Profundidad técnica'),[55,10,20,5,10]],[L('Social impact','Impacto social'),[10,55,10,15,10]],[L('Execution first','Ejecución primero'),[15,20,10,10,45]],[L('Leadership','Liderazgo'),[15,15,15,45,10]],[L('Current weights','Pesos actuales'),state.weights]];let dom=P.filter(p=>!P.some(q=>q!==p&&q.r.every((x,i)=>x>=p.r[i])&&q.r.some((x,i)=>x>p.r[i])));return hero('04 / '+L('Analysis lab','Laboratorio de análisis'),L('Understand what drives results.','Entiende qué impulsa resultados.'),L('Sensitivity, scenarios, Pareto trade-offs and ranking stability.','Sensibilidad, escenarios, frontera de Pareto y estabilidad del ranking.'))+`<section class="panel"><div class="section-head"><h2>${L('Sensitivity analysis','Análisis de sensibilidad')}</h2><select onchange="simID=this.value;render()">${P.map(q=>opt(q,p.id)).join('')}</select></div><p class="muted">${L('One input at a time, same seed; baseline','Un parámetro a la vez, misma semilla; base')} ${pct(base.hit)}.</p><div class="scroll"><table class="comparetable analysis-table"><thead><tr><th>${L('Driver','Factor')}</th><th>${L('Lower input','Entrada baja')}</th><th>${L('Baseline','Base')}</th><th>${L('Higher input','Entrada alta')}</th><th>${L('Spread (pp)','Rango (pp)')}</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.label}</td><td>${pct(x.lo)} <small>(${x.loPct}%)</small></td><td>${pct(base.hit)}</td><td>${pct(x.hi)} <small>(+${x.hiPct}%)</small></td><td>${fmt((x.hi-x.lo)*100,1)}${bar(Math.abs(x.hi-x.lo)*100)}</td></tr>`).join('')}</tbody></table></div></section><div class="grid detail-grid spaced">${panel('01 / '+L('Scenarios','Escenarios'),L('Stress test','Prueba de estrés'),`<div class="scenario-list">${[[L('Constrained','Restringido'),.65,.7,.7],[L('Base','Base'),1,1,1],[L('Favorable','Favorable'),1.25,1.2,1.25]].map(([n,h,b,k])=>{let r=simulate(p,{...state.sim,hours:Math.min(30,state.sim.hours*h),budget:state.sim.budget*b,partner:Math.min(200,state.sim.partner*k)},base.n);return `<div><div class="section-head"><strong>${n}</strong><strong>${pct(r.hit)}</strong></div>${bar(r.hit*100)}<p class="note">${L('Hours / budget / partners','Horas / presupuesto / socios')}: ${h}× / ${b}× / ${k}× · P50 ${fmt(r.q50)} ${model(p).unit}</p></div>`}).join('')}</div>`)}${panel('02 / '+L('Decision stability','Estabilidad'),L('Rank by different priorities','Ranking según prioridades'),`<div class="scroll"><table class="comparetable analysis-table" style="min-width:320px"><thead><tr><th>${L('Preference','Preferencia')}</th><th>${L('Top projects (score)','Primeros proyectos (puntaje)')}</th></tr></thead><tbody>${presets.map(([n,w])=>`<tr><td>${n}</td><td>${[...P].sort((a,b)=>score(b,w)-score(a,w)||b.base-a.base).slice(0,3).map(q=>`${q.name} (${fmt(score(q,w),1)})`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>` )}</div><div class="grid detail-grid spaced">${panel('03 / Pareto',L('Non-dominated projects','Proyectos no dominados'),`<p>${L('No other project is at least as strong on all five rubric dimensions and strictly stronger on one. Equal vectors are retained.','Ningún otro proyecto es igual o superior en las cinco dimensiones y estrictamente superior en una. Se conservan vectores iguales.')}</p>${list(dom.map(q=>q.name))}<p class="note">${L('This uses only the original subjective ratings, not cost or simulation outcomes.','Usa solo las calificaciones subjetivas originales, no costo ni resultados simulados.')}</p>`)}${panel('04 / '+L('Efficiency','Eficiencia'),L('Target probability vs. effort','Probabilidad de meta vs. esfuerzo'),scatter())}</div>`}
function scatter(){let r=results(),max=Math.max(...P.map(p=>model(p).effort[1]))*1.15;return `<svg viewBox="0 0 360 220" style="width:100%;height:auto" role="img" aria-label="${L('Effort versus success probability','Esfuerzo frente a probabilidad')}">${[0,.25,.5,.75,1].map(x=>`<line x1="42" y1="${180-x*155}" x2="340" y2="${180-x*155}" stroke="var(--line)"/><text x="36" y="${184-x*155}" text-anchor="end" font-size="10" fill="var(--muted)">${x*100}%</text>`).join('')}${P.map((p,i)=>{let x=42+model(p).effort[1]/max*298,y=180-r[p.id].hit*155;return `<circle cx="${x}" cy="${y}" r="6" fill="var(--accent)" fill-opacity=".8"><title>${p.name}: ${pct(r[p.id].hit)}</title></circle><text x="${x+8}" y="${y-5}" font-size="10" fill="var(--ink)">${i+1}</text>`}).join('')}<g fill="var(--muted)" font-size="10"><text x="42" y="197">0</text><text x="340" y="197" text-anchor="end">${fmt(max)} h</text><text x="190" y="215" text-anchor="middle">${L('Modal build effort','Esfuerzo modal')}</text></g></svg><div class="legend">${P.map((p,i)=>`<span>${i+1}. ${p.name}</span>`).join('')}</div>`}
function detail(){let p=get(detailId),q=loc(p),m=model(p),r=results()[p.id],d=DEEP[idx(p)];return `<button class="back" onclick="go('projects')">← ${L('All projects','Todos los proyectos')}</button>`+hero(q.domain,p.name,q.summary)+`<div class="actions" style="margin-bottom:20px"><button class="primary" onclick="state.focus='${p.id}';save();go('plan')">${L('Open execution plan','Abrir plan de acción')}</button><button onclick="go('simulation','${p.id}')">${L('Run simulation','Simular')}</button><button class="${state.favorites.includes(p.id)?'active':''}" onclick="favorite('${p.id}')">${state.favorites.includes(p.id)?'★':'☆'} ${L('Save','Guardar')}</button><button class="${state.compare.includes(p.id)?'active':''}" onclick="comparePick('${p.id}')">${L('Compare','Comparar')}</button></div><div class="grid stats">${stat(L('Weighted score','Puntaje ponderado'),fmt(score(p),1),L('Original score','Puntaje original')+' '+p.base)}${stat(L('MVP probability','Probabilidad MVP'),pct(r.mvp),L('Illustrative simulation','Simulación ilustrativa'))}${stat(L('Target probability','Probabilidad de meta'),pct(r.hit),fmt(m.target)+' '+m.unit)}${stat(L('Build effort','Esfuerzo de construcción'),fmt(m.effort[1])+' h',L('Modal estimate','Estimación modal'))}</div><div class="grid detail-grid">${panel('01 / '+L('Product','Producto'),L('What to build','Qué construir'),list(q.product)+`<div class="callout"><h3>${L('Why it fits','Por qué encaja')}</h3><p>${q.why}</p></div>`)}${panel('02 / '+L('Assessment','Evaluación'),L('Decision rubric','Rúbrica de decisión'),criteria().map((c,i)=>`<div class="rubricrow"><span>${c}</span>${bar(p.r[i]*20)}<strong>${p.r[i]}/5</strong></div>`).join('')+`<p class="note">${L('Original subjective ratings, adjustable weights in Overview.','Calificaciones subjetivas originales; ajusta pesos en Resumen.')}</p>`)}${panel('03 / '+L('Impact','Impacto'),L('Original September targets','Metas originales de septiembre'),`<div class="metrics">${q.metrics.map(([v,l])=>`<div class="metricbox"><strong>${esc(v)}</strong><span>${l}</span></div>`).join('')}</div><p class="note">${L('Aspirational targets, not achievements.','Metas aspiracionales, no logros.')}</p>`)}${panel('04 / '+L('First steps','Primeros pasos'),L('The next two weeks','Las próximas dos semanas'),list(q.start)+`<div class="callout"><h3>${L('Main risk','Riesgo principal')}</h3><p>${q.risk}</p></div>`)}${panel('05 / '+L('Milestones','Hitos'),L('Technical execution roadmap','Ruta de ejecución técnica'),d[state.lang==='es'?1:0].map((t,i)=>`<div class="phase"><div class="date">${['DEC–FEB','MAR–APR','MAY–JUL','AUG–SEP'][i]}</div><div>${esc(t)}</div></div>`).join(''))}${panel('06 / '+L('Measurement','Medición'),L('Evidence and evaluation','Evidencia y evaluación'),`<p>${d[state.lang==='es'?3:2]}</p>${list(q.evidence)}<p class="note">${L('Obtain consent and avoid publishing participants’ identifying information.','Obtén consentimiento y evita publicar datos identificables.')}</p>`)}</div><div class="grid detail-grid spaced">${panel('07 / '+L('Simulation','Simulación'),L('Outcome distribution','Distribución de resultados'),hist(r)+`<p>P10 / P50 / P90: <strong>${[r.q10,r.q50,r.q90].map(x=>fmt(x)).join(' / ')}</strong> ${m.unit}</p><button onclick="go('simulation','${p.id}')">${L('Change assumptions','Cambiar supuestos')} →</button>`)}${panel('08 / '+L('Tracking','Seguimiento'),L('Actual progress','Progreso real'),`<label class="field"><span>${L('Verified outcome to date','Resultado verificado a la fecha')} (${m.unit})</span><input type="number" min="0" value="${state.actual[p.id]??0}" onchange="state.actual['${p.id}']=Math.max(0,+this.value||0);save();render()"></label>${bar((state.actual[p.id]||0)/m.target*100)}<p>${fmt(state.actual[p.id]||0)} / ${fmt(m.target)} · ${pct((state.actual[p.id]||0)/m.target)}</p><label class="field"><span>${L('Private notes / evidence references','Notas privadas / referencias de evidencia')}</span><textarea rows="4" oninput="state.notes['${p.id}']=this.value;save()">${esc(state.notes[p.id]||'')}</textarea></label><div class="progress">${bar(progress(p)/tasks(p).length*100)}<strong>${progress(p)}/${tasks(p).length}</strong></div><button onclick="state.focus='${p.id}';save();go('plan')">${L('Manage checklist','Gestionar tareas')}</button>` )}</div>`}
function portfolio(){let chosen=P.filter(p=>(state.portfolio[p.id]||0)>0),sum=chosen.reduce((a,p)=>a+state.portfolio[p.id],0),rs=chosen.map(p=>({p,r:simulate(p,state.sim,Math.min(state.sim.trials,10000),state.portfolio[p.id]/Math.max(100,sum),false,state.portfolio[p.id]/Math.max(100,sum))})),any=1-rs.reduce((a,x)=>a*(1-x.r.hit),1),all=rs.length?rs.reduce((a,x)=>a*x.r.hit,1):0;return hero('05 / '+L('Portfolio planner','Planificador de portafolio'),L('Allocate finite resources.','Distribuye recursos finitos.'),L('Split your available project time and budget across projects. Unallocated capacity stays reserved.','Distribuye tiempo y presupuesto entre proyectos. La capacidad no asignada queda en reserva.'))+`<div class="grid stats">${stat(L('Active projects','Proyectos activos'),chosen.length)}${stat(L('Allocation','Asignación'),sum+'%',sum>100?L('Normalized to 100%','Normalizado a 100%'):L('Remaining reserve','Reserva')+' '+(100-sum)+'%')}${stat(L('At least one target','Al menos una meta'),pct(any),L('Independence approximation','Aproximación independiente'))}${stat(L('All targets','Todas las metas'),pct(all),L('Independence approximation','Aproximación independiente'))}</div><div class="grid split">${panel('01 / '+L('Allocation','Asignación'),L('Time and budget shares','Cuotas de tiempo y presupuesto'),`<div class="actions"><button onclick="state.portfolio={robotics:100};save();render()">${L('Single focus','Un proyecto')}</button><button onclick="state.portfolio={robotics:60,lermente:40};save();render()">60/40</button><button onclick="state.portfolio={};save();render()">${L('Clear','Limpiar')}</button></div>${P.map(p=>`<div class="weightrow"><label>${p.name}</label><output>${state.portfolio[p.id]||0}%</output><input aria-label="${p.name}" type="range" min="0" max="100" step="5" value="${state.portfolio[p.id]||0}" oninput="this.previousElementSibling.textContent=this.value+'%'" onchange="state.portfolio['${p.id}']=+this.value;save();render()"></div>`).join('')}`)}${panel('02 / '+L('Results','Resultados'),L('Resource-adjusted outcomes','Resultados ajustados por recursos'),rs.length?rs.map(({p,r})=>`<div class="scenario-list"><h3>${p.name}</h3><p>${fmt(state.sim.hours*state.portfolio[p.id]/Math.max(sum,100),1)} h/${L('week','semana')} · ${money(state.sim.budget*state.portfolio[p.id]/Math.max(sum,100))}</p><div class="section-head"><span>${L('Target probability','Probabilidad de meta')}</span><strong>${pct(r.hit)}</strong></div>${bar(r.hit*100)}<p class="note">MVP ${pct(r.mvp)} · P50 ${fmt(r.q50)} ${model(p).unit}</p></div>`).join(''):`<p>${L('Allocate resources to a project.','Asigna recursos a un proyecto.')}</p>`)}</div><p class="note">${L('Joint probabilities use a simplifying independence assumption; correlated risks (school deadlines, shared mentors, overlapping tools) are not modeled. Robotics and Research may share work in practice, but this planner treats them separately.','Las probabilidades conjuntas suponen independencia; riesgos correlacionados (escuela, mentores, herramientas) no se modelan. Robótica e Investigación podrían compartir trabajo, pero se tratan por separado.')}</p>`}
function plan(){let p=get(state.focus),q=loc(p),t=tasks(p);return hero('06 / '+L('Execution','Ejecución'),L('From idea to evidence.','De idea a evidencia.'),L('Track tasks and tangible outcomes. Keep evidence of what you actually achieved.','Registra tareas y resultados tangibles. Conserva evidencia de lo que realmente lograste.'))+`<section class="panel"><div class="selectline"><label>${L('Active project','Proyecto activo')}</label><select onchange="focus(this.value)">${P.map(x=>opt(x,p.id)).join('')}</select><button onclick="go('detail','${p.id}')">${L('Details','Detalles')}</button></div><div class="progress">${bar(progress(p)/t.length*100)}<strong>${progress(p)}/${t.length}</strong></div></section><div class="grid split spaced">${panel('01 / '+L('Checklist','Lista de tareas'),L('Action items','Acciones'),t.map((x,i)=>`<label class="task ${(state.done[p.id]||[]).includes(i)?'done':''}"><input type="checkbox" ${(state.done[p.id]||[]).includes(i)?'checked':''} onchange="toggle('${p.id}',${i},this.checked)"><span>${esc(x)}</span></label>`).join(''))}${panel('02 / '+L('Evidence','Evidencia'),L('Verification plan','Plan de verificación'),list(q.evidence)+`<p>${DEEP[idx(p)][state.lang==='es'?3:2]}</p><label class="field"><span>${L('Notes / evidence links','Notas / enlaces de evidencia')}</span><textarea rows="6" oninput="state.notes['${p.id}']=this.value;save()">${esc(state.notes[p.id]||'')}</textarea></label>` )}</div><div class="spaced">${panel('03 / '+L('Timeline','Calendario'),L('September 2027 roadmap','Ruta a septiembre de 2027'),DEEP[idx(p)][state.lang==='es'?1:0].map((t,i)=>`<div class="phase"><div class="date">${['DEC–FEB','MAR–APR','MAY–JUL','AUG–SEP'][i]}</div><div>${esc(t)}</div></div>`).join(''))}</div>`}
function download(name,body,type){let u=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportData(){download('projects-2027-data.json',JSON.stringify({settings:state,projects:P.map(p=>({...loc(p),model:model(p),score:score(p),simulation:results()[p.id]})),disclaimer:L('Hypothetical, not admissions predictions.','Hipotético, no predice admisión.')},null,2),'application/json')}function downloadCSV(){let rows=[['Project','Target','Unit','MVP probability','Target probability','P10','P50','P90','Mean','P90 cost USD','Trials','Seed'],...P.map(p=>{let r=results()[p.id],m=model(p);return [p.name,m.target,m.unit,r.mvp,r.hit,r.q10,r.q50,r.q90,r.mean,r.cost90,r.n,state.sim.seed]})];download('projects-2027-simulation.csv',rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}
function render(){document.documentElement.lang=state.lang;$('language').value=state.lang;$('nav').innerHTML=navs.map(([id,en,es,icon])=>`<button class="${view===id||view==='detail'&&id==='projects'?'active':''}" onclick="go('${id}')"><span class="navicon" aria-hidden="true">${icon}</span>${L(en,es)}</button>`).join('');$('crumb').textContent=L('Workspace','Espacio de trabajo')+' / '+(view==='detail'?L('Project','Proyecto'):L(navs.find(x=>x[0]===view)[1],navs.find(x=>x[0]===view)[2]));$('sidefoot').innerHTML=`NOV 2026 — SEP 2027<br>${L('Personal planning workspace','Espacio de planificación personal')}<br>${L('Saved in this browser.','Guardado en este navegador.')}`;$('exportButton').textContent=L('Export data','Exportar datos');$('printButton').textContent=L('Print','Imprimir');$('app').innerHTML=({overview,projects,compare,detail,simulation,analytics,portfolio,plan}[view]||overview)()+`<footer class="footer">Projects / 2027 · ${L('Illustrative planning assumptions. Targets are not achievements or admissions probabilities.','Supuestos ilustrativos. Las metas no son logros ni probabilidades de admisión.')}</footer>`}render();
</script></body></html>
